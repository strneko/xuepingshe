services:
  postgres:
    image: postgres:16
    container_name: xuepingshe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: xuepingshe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xuepingshe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
